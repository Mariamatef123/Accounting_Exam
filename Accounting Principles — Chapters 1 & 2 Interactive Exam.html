let st={},ord=Q.map(q=>q.id),sec="all",$=id=>document.getElementById(id);
const inst=()=>$("inst").checked;
const ok=q=>{const s=st[q.id];return s&&s.v!==undefined&&(q.num?Number(String(s.v).replace(/[, ]/g,""))===q.a:s.v===q.a)};
function tabs(){const t=[["all","All ("+Q.length+")"],["c1","Chapter 1 ("+Q.filter(q=>q.s<7).length+")"],["c2","Chapter 2 ("+Q.filter(q=>q.s>=7).length+")"]].concat(SEC.map((n,i)=>[i,n+" ("+Q.filter(q=>q.s===i).length+")"]),[["tf","True / False Only ("+Q.filter(q=>q.tf).length+")"]]);
$("tabs").innerHTML="";t.forEach(([k,l])=>{const b=document.createElement("button");b.className="tab"+(k===sec?" on":"");b.textContent=l;b.onclick=()=>{sec=k;tabs();draw()};$("tabs").appendChild(b)})}
function draw(){const L=$("list"),s=$("q").value.toLowerCase(),f=$("show").value;L.innerHTML="";let n=0;
ord.forEach(id=>{const q=Q[id],S=st[id]||{};
if(sec==="tf"?!q.tf:sec==="c1"?q.s>6:sec==="c2"?q.s<7:(sec!=="all"&&q.s!==sec))return;
if(s&&!(q.t+(q.o||[]).join(" ")).toLowerCase().includes(s))return;
if(f==="un"&&S.v!==undefined)return;if(f==="ok"&&!(S.done&&ok(q)))return;if(f==="no"&&!(S.done&&!ok(q)))return;
n++;const d=document.createElement("div");d.className="q"+(S.done?(ok(q)?" ok":" no"):"");
d.innerHTML='<div class="tag">#'+(id+1)+" · "+SEC[q.s]+'</div><div class="qt"></div>';d.querySelector(".qt").textContent=q.t;
if(q.num){const w=document.createElement("div");w.className="num";const i=document.createElement("input");i.type="text";i.inputMode="numeric";i.placeholder="Your answer";i.value=S.v??"";i.disabled=!!S.done;const b=document.createElement("button");b.className="pri";b.textContent="Check";b.disabled=!!S.done;
b.onclick=()=>{if(i.value.trim()===""){return}st[id]={v:i.value,done:true};upd()};w.append(i,b);d.appendChild(w)}
else q.o.forEach((o,k)=>{const b=document.createElement("button");b.className="o";b.textContent=String.fromCharCode(65+k)+". "+o;
if(S.done){b.disabled=true;if(k===q.a)b.classList.add("right");else if(k===S.v)b.classList.add("wrong")}else if(S.v===k)b.classList.add("sel");
b.onclick=()=>{st[id]={v:k,done:inst()};upd()};d.appendChild(b)});
if(S.done){const x=document.createElement("div");x.className="n";x.textContent=(ok(q)?"✓ Correct. ":"✗ Incorrect. ")+(q.num?"Answer: "+q.a.toLocaleString("en-US")+" EGP. ":"")+(q.n||"");d.appendChild(x)}
L.appendChild(d)});
if(!n)L.innerHTML='<div class="emp">No questions match.</div>';
const a=Q.filter(q=>st[q.id]&&st[q.id].v!==undefined).length,dn=Q.filter(q=>st[q.id]&&st[q.id].done),c=dn.filter(ok).length;
$("cnt").textContent=Q.length+" Questions";$("ans").textContent="Answered: "+a+" / "+Q.length;$("scr").textContent="Score: "+c+" / "+dn.length+" ("+(dn.length?Math.round(100*c/dn.length):0)+"%)"}
function upd(){const y=window.scrollY;draw();window.scrollTo(0,y)}
$("q").oninput=draw;$("show").onchange=draw;
$("shuf").onclick=()=>{for(let i=ord.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ord[i],ord[j]]=[ord[j],ord[i]]}draw()};
$("grade").onclick=()=>{Q.forEach(q=>{if(st[q.id]&&st[q.id].v!==undefined)st[q.id].done=true});draw()};
$("rst").onclick=()=>{st={};ord=Q.map(q=>q.id);draw()};
tabs();draw();
</script></body></html>
